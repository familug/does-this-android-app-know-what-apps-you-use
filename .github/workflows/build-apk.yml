name: Build Android APK

on:
  push:
    branches: [ "main" ]
    paths:
      - 'app-query-checker/**'
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'app-query-checker/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Build debug APK
      working-directory: app-query-checker
      run: ./gradlew assembleDebug

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-query-checker-debug
        path: app-query-checker/app/build/outputs/apk/debug/app-debug.apk

    - name: Create release on tag
      if: startsWith(github.ref, 'refs/tags/v')
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        VERSION="${GITHUB_REF#refs/tags/}"
        cp app-query-checker/app/build/outputs/apk/debug/app-debug.apk app-query-checker-debug.apk
        gh release create "$VERSION" \
          --title "App Query Checker $VERSION" \
          --notes "Install on your Android device to see which of your installed apps can view your other installed apps." \
          app-query-checker-debug.apk
